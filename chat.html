<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Ai</title>
<link rel="icon" type="image/svg" href="kinger-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">

  <div class="chat-layout">
    <aside class="chat-sidebar">
      <a href="index.html" class="sidebar-logo-link" aria-label="Volver a inicio">
        <img src="kinger-icono.svg" alt="Kinger" class="sidebar-logo">

      </a>

      <button type="button" class="sidebar-new-chat" id="newChatBtn">
        <span class="plus-icon" aria-hidden="true">+</span> Nuevo chat
      </button>

      <div class="sidebar-history">
        <p class="sidebar-history-label">Recientes</p>
        <p class="sidebar-history-empty">Tus conversaciones aparecerán aquí</p>
      </div>

      <a href="index.html" class="sidebar-back">← Volver a inicio</a>
    </aside>

    <main class="chat-main">
      <div class="chat-main-inner" id="chatMainInner">
        <div class="chat-empty-state" id="emptyState">
          <img src="kinger-icono.svg" alt="" class="empty-logo">
          <h1>¿En qué te ayudo hoy?</h1>
        </div>

        <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

        <div class="chat-typing" id="typingIndicator" hidden>
          <span></span><span></span><span></span>
        </div>
      </div>

      <form class="chat-input-row chat-input-floating" id="chatForm">
        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="Escríbele a Kinger…"
          autocomplete="off"
          aria-label="Mensaje para Kinger"
        >
        <button type="submit" class="btn-send" aria-label="Enviar mensaje">Enviar</button>
      </form>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
